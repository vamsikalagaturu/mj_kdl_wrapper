name: sanitizers

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and headless examples under AddressSanitizer + UndefinedBehaviorSanitizer.
  asan-ubsan:
    runs-on: ubuntu-24.04
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      # System build dependencies (KDL and MuJoCo are built from source, not installed from apt);
      # the X11, Wayland and GL headers are what MuJoCo's Filament and SDL2 builds use.
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache ninja-build ffmpeg vcstool \
            libeigen3-dev libegl-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Import the Orocos KDL fork and MuJoCo
        run: vcs import < mj_kdl_wrapper.repos

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ runner.os }}-

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/Versions.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${SAN_FLAGS}" \
            -DMJ_KDL_WITH_RENDER=ON \
            -DMJ_KDL_WITH_VIEWER=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCS=OFF \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.supp:print_suppressions=0
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 900 | tee ctest.log
          # A test that did not run fails the job; an opt-in DISABLED_ one is expected not to.
          ! awk '/tests did not run/{f=1;next} f&&/^[ \t]+[0-9]+ - /{print;next} {f=0}' ctest.log \
            | grep -v '(Disabled)'
