name: sanitizers

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests and headless examples under AddressSanitizer + UndefinedBehaviorSanitizer.
  asan-ubsan:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_VERSION: 3.14.0
      MJ_KDL_MUJOCO_DIR: /tmp/mujoco-3.14.0
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache ninja-build \
            libeigen3-dev libglfw3-dev libgl-dev libegl-dev

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@v4
        with:
          path: ${{ env.MJ_KDL_MUJOCO_DIR }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}

      - name: Install MuJoCo ${{ env.MUJOCO_VERSION }}
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      # Keyed on the pins, no fallback: a kept checkout is never moved to a new pin.
      - name: Cache MuJoCo Menagerie
        uses: actions/cache@v4
        with:
          path: ~/.cache/mj_kdl_wrapper/menagerie
          key: menagerie-${{ runner.os }}-${{ hashFiles('cmake/Versions.cmake') }}

      - name: Cache the Orocos KDL checkout
        uses: actions/cache@v4
        with:
          path: third_party/orocos_kinematics_dynamics
          key: orocos-kdl-${{ hashFiles('cmake/Versions.cmake') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-asan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-asan-${{ runner.os }}-

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/Versions.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${SAN_FLAGS}" \
            -DMJ_KDL_MUJOCO_DIR="${MJ_KDL_MUJOCO_DIR}" \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCS=OFF \
            -DMJ_KDL_FETCH_MENAGERIE=ON \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build

      - name: Check Menagerie
        run: test -f ~/.cache/mj_kdl_wrapper/menagerie/kinova_gen3/gen3.xml

      - name: Test
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/lsan.supp:print_suppressions=0
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --timeout 900 | tee ctest.log
          # A test that did not run fails the job; an opt-in DISABLED_ one is expected not to.
          ! awk '/tests did not run/{f=1;next} f&&/^[ \t]+[0-9]+ - /{print;next} {f=0}' ctest.log \
            | grep -v '(Disabled)'

  # The Simulate UI's render thread against the control loop, under ThreadSanitizer.
  tsan:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_VERSION: 3.14.0
      MJ_KDL_MUJOCO_DIR: /tmp/mujoco-3.14.0
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      SAN_FLAGS: -fsanitize=thread -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache ninja-build xvfb libgl1-mesa-dri \
            libeigen3-dev libglfw3-dev libgl-dev libegl-dev

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@v4
        with:
          path: ${{ env.MJ_KDL_MUJOCO_DIR }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}

      - name: Install MuJoCo ${{ env.MUJOCO_VERSION }}
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      # Keyed on the pins, no fallback: a kept checkout is never moved to a new pin.
      - name: Cache MuJoCo Menagerie
        uses: actions/cache@v4
        with:
          path: ~/.cache/mj_kdl_wrapper/menagerie
          key: menagerie-${{ runner.os }}-${{ hashFiles('cmake/Versions.cmake') }}

      - name: Cache the Orocos KDL checkout
        uses: actions/cache@v4
        with:
          path: third_party/orocos_kinematics_dynamics
          key: orocos-kdl-${{ hashFiles('cmake/Versions.cmake') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-tsan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-tsan-${{ runner.os }}-

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/Versions.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${SAN_FLAGS}" \
            -DMJ_KDL_MUJOCO_DIR="${MJ_KDL_MUJOCO_DIR}" \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF \
            -DMJ_KDL_FETCH_MENAGERIE=ON \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build --target test_scene_state

      - name: Check Menagerie
        run: test -f ~/.cache/mj_kdl_wrapper/menagerie/kinova_gen3/gen3.xml

      # The viewer test is opt-in (it opens a window); Xvfb gives it one.
      - name: Viewer lock test
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/test/tsan.supp halt_on_error=1
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a build/test/test_scene_state \
            --gtest_also_run_disabled_tests --gtest_filter='*Viewer*'
