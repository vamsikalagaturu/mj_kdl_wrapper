name: docs

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    env:
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
    steps:
      - uses: actions/checkout@v4

      # The docs need the configured project only, so render and viewer are left out.
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build vcstool libeigen3-dev

      - name: Install Doxygen 1.16.1
        run: |
          wget -q "https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz" -O /tmp/doxygen.tar.gz
          tar xzf /tmp/doxygen.tar.gz -C /tmp
          sudo cp /tmp/doxygen-1.16.1/bin/doxygen /usr/local/bin/
          doxygen --version

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'test/CMakeLists.txt', 'cmake/Versions.cmake') }}

      # The docs link the fork's headers, so the docs target builds KDL.
      - name: Import the Orocos KDL fork and MuJoCo
        run: vcs import < mj_kdl_wrapper.repos

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMJ_KDL_WITH_RENDER=OFF \
            -DMJ_KDL_WITH_VIEWER=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=ON \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build docs
        run: cmake --build build --target docs

      - name: Upload Pages artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  deploy-docs:
    needs: docs
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
