name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_VERSION: 3.9.0
      MUJOCO_ROOT: /tmp/mujoco-3.9.0
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache \
            ninja-build \
            libeigen3-dev \
            libglfw3-dev \
            libgl-dev \
            libegl-dev

      - name: Install docs dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sudo apt-get install -y \
            doxygen

      - name: Fetch doxygen-awesome-css
        # Ensure the doxygen theme files exist on the runner for docs generation
        run: |
          mkdir -p third_party
          if [[ -d third_party/doxygen-awesome-css && -d third_party/doxygen-awesome-css/.git ]]; then
            echo "doxygen-awesome-css already present"
          elif [[ -d third_party/doxygen-awesome-css ]]; then
            echo "third_party/doxygen-awesome-css exists but is not a git repository"
            ls -la third_party/doxygen-awesome-css
            exit 1
          else
            git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git third_party/doxygen-awesome-css
          fi

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@v4
        with:
          path: ${{ env.MUJOCO_ROOT }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}

      - name: Install MuJoCo ${{ env.MUJOCO_VERSION }}
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      - name: Cache MuJoCo Menagerie
        id: cache-menagerie
        uses: actions/cache@v4
        with:
          path: third_party/menagerie
          key: menagerie-${{ runner.os }}-v1
          restore-keys: |
            menagerie-${{ runner.os }}-

      - name: Fetch MuJoCo Menagerie
        if: steps.cache-menagerie.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          if [[ -d third_party/menagerie/.git ]]; then
            echo "Using restored MuJoCo Menagerie cache"
          elif [[ -d third_party/menagerie ]]; then
            echo "third_party/menagerie already exists but is not a git checkout"
            exit 1
          else
            git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git third_party/menagerie
          fi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          docs_flag=OFF
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            docs_flag=ON
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DMUJOCO_ROOT="${MUJOCO_ROOT}" \
            -DBUILD_TESTS=ON \
            -DFETCH_MENAGERIE=OFF \
            -DBUILD_DOCS="${docs_flag}" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cmake --build build --target docs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

  python-bindings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            git \
            libeigen3-dev \
            libglfw3-dev \
            libgl-dev \
            libegl-dev
          pip install uv

      - name: Build and install the wheel
        # Under scikit-build the build downloads MuJoCo and builds the secorolab
        # Orocos KDL + PyKDL automatically.
        run: |
          uv venv .venv
          . .venv/bin/activate
          uv pip install .

      - name: Fetch Menagerie models
        run: |
          git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git third_party/menagerie

      - name: Test and smoke an example
        run: |
          . .venv/bin/activate
          uv pip install pytest
          pytest -q python/tests
          python python/examples/ex_gravity_comp.py

  deploy-docs:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
