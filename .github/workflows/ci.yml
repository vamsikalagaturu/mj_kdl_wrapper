name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_VERSION: 3.8.0
      MUJOCO_ROOT: /tmp/mujoco-3.8.0
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache \
            ninja-build \
            liborocos-kdl-dev \
            libglfw3-dev \
            libgl-dev \
            libegl-dev

      - name: Install docs dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sudo apt-get install -y \
            doxygen

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@v4
        with:
          path: ${{ env.MUJOCO_ROOT }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}

      - name: Install MuJoCo 3.8.0
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      - name: Cache MuJoCo Menagerie
        id: cache-menagerie
        uses: actions/cache@v4
        with:
          path: third_party/menagerie
          key: menagerie-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            menagerie-${{ runner.os }}-

      - name: Fetch MuJoCo Menagerie
        if: steps.cache-menagerie.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/google-deepmind/mujoco_menagerie.git third_party/menagerie

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          docs_flag=OFF
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            docs_flag=ON
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DMUJOCO_ROOT="${MUJOCO_ROOT}" \
            -DBUILD_TESTS=ON \
            -DFETCH_MENAGERIE=OFF \
            -DBUILD_DOCS="${docs_flag}" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cmake --build build --target docs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy-docs:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
