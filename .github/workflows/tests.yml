name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_VERSION: 3.9.0
      MJ_KDL_MUJOCO_DIR: /tmp/mujoco-3.9.0
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fetchcontent
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      # System build dependencies (KDL/MuJoCo are not installed from apt).
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache ninja-build \
            libeigen3-dev libglfw3-dev libgl-dev libegl-dev

      # Native MuJoCo release (cached between runs).
      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@v4
        with:
          path: ${{ env.MJ_KDL_MUJOCO_DIR }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}

      - name: Install MuJoCo ${{ env.MUJOCO_VERSION }}
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      # Models + bundled assets the tests load, in the user cache the resolvers
      # read; Configure (MJ_KDL_FETCH_MENAGERIE=ON below) populates it on a miss.
      - name: Cache MuJoCo Menagerie + assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/mj_kdl_wrapper
          key: menagerie-${{ runner.os }}-v2
          restore-keys: |
            menagerie-${{ runner.os }}-

      # Compiler cache, shared with the build workflow via the common prefix.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ env.FETCHCONTENT_BASE_DIR }}
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DMJ_KDL_MUJOCO_DIR="${MJ_KDL_MUJOCO_DIR}" \
            -DBUILD_TESTS=ON \
            -DBUILD_DOCS=OFF \
            -DMJ_KDL_FETCH_MENAGERIE=ON \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_BASE_DIR}" \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
