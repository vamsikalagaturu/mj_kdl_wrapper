name: build

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The library, installed and consumed through CMake and pkg-config; tests.yml builds the rest.
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      PREFIX: ${{ github.workspace }}/prefix
    steps:
      - uses: actions/checkout@v4

      # System build dependencies (KDL and MuJoCo are built from source, not installed from apt);
      # the X11, Wayland and GL headers are what MuJoCo's Filament and SDL2 builds use.
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache ninja-build pkg-config vcstool \
            libeigen3-dev libegl-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Import the Orocos KDL fork and MuJoCo
        run: vcs import < mj_kdl_wrapper.repos

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-build-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
            -DMJ_KDL_WITH_RENDER=ON \
            -DMJ_KDL_WITH_VIEWER=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_DOCS=OFF

      - name: Build and install
        run: |
          cmake --build build
          cmake --install build

      # A consumer of the install; the system liborocos-kdl path must not win over the bundled one.
      - name: Consume the install
        run: |
          mkdir -p consumer
          cat > consumer/main.cpp <<'EOF'
          #include <mj_kdl_wrapper/mj_kdl_wrapper.hpp>
          #include <mj_kdl_wrapper/render.hpp>
          #include <mj_kdl_wrapper/viewer.hpp>
          #include <kdl/chaindynparam.hpp>
          int main()
          {
              mj_kdl::Env env;
              mj_kdl::Viewer viewer;
              mj_kdl::VideoRecorder recorder;
              KDL::Chain chain;
              KDL::ChainDynParam dyn(chain, KDL::Vector(0, 0, -9.81));
              return env.model == nullptr && !mj_kdl::is_running(&viewer) ? 0 : 1;
          }
          EOF
          cat > consumer/core.cpp <<'EOF'
          #include <mj_kdl_wrapper/mj_kdl_wrapper.hpp>
          int main()
          {
              mj_kdl::Env env;
              return env.model == nullptr ? 0 : 1;
          }
          EOF
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(mj_kdl_wrapper REQUIRED COMPONENTS render viewer)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE mj_kdl_wrapper::viewer)
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="${PREFIX}"
          cmake --build consumer/build
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig"
          g++ -std=c++20 consumer/core.cpp -o consumer/pc_consumer \
            $(pkg-config --cflags --libs mj_kdl_wrapper)
          for exe in consumer/build/consumer consumer/pc_consumer; do
            readelf -d "${exe}" | grep -q '(RPATH)'
            LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu ldd "${exe}" \
              | grep -q "liborocos-kdl.so.* => ${PREFIX}/lib/"
            LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu "${exe}"
          done
