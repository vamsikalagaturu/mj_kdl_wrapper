name: ros2

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  colcon:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ROS 2 LTS distros to support: Jazzy Jalisco and Lyrical Luth.
        ros_distro: [jazzy, lyrical]
    container:
      image: ros:${{ matrix.ros_distro }}
    env:
      MUJOCO_VERSION: 3.14.0
      MJ_KDL_MUJOCO_DIR: /tmp/mujoco-3.14.0
    steps:
      # System build dependencies (KDL/MuJoCo are not installed from apt).
      - name: Install dependencies
        run: |
          apt-get update -q
          apt-get install -y \
            git wget cmake g++ \
            libeigen3-dev libglfw3-dev libgl-dev libegl-dev ffmpeg \
            python3-colcon-common-extensions

      # Native MuJoCo release the wrapper builds against.
      - name: Install MuJoCo ${{ env.MUJOCO_VERSION }}
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      # The wrapper goes under the colcon workspace src/.
      - name: Checkout the wrapper into the workspace
        uses: actions/checkout@v4
        with:
          path: ws/src/mj_kdl_wrapper

      # The secorolab Orocos KDL fork is a sibling workspace package, at MJ_KDL_OROCOS_KDL_GIT_SHA
      # (cmake/Versions.cmake; scripts/check_versions.py keeps the two equal).
      - name: Clone the Orocos KDL fork
        run: |
          git clone https://github.com/secorolab/orocos_kinematics_dynamics.git \
            ws/src/orocos_kinematics_dynamics
          git -C ws/src/orocos_kinematics_dynamics checkout --detach \
            c86af053388aa78d2c5ad2fa6afe1fd556621ce8

      # Build the shared KDL first, then the wrapper against it (FROM_PACKAGE).
      - name: colcon build (KDL first, then the wrapper against it)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ws
          colcon build --packages-select orocos_kdl --cmake-args -DENABLE_TESTS=OFF
          source install/setup.bash
          colcon build --packages-select mj_kdl_wrapper \
            --cmake-args -DMJ_KDL_OROCOS_KDL_FROM_PACKAGE=ON \
                         -DMJ_KDL_MUJOCO_DIR="${MJ_KDL_MUJOCO_DIR}" \
                         -DMJ_KDL_WITH_ROS=ON \
                         -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF

      # The ROS camera publisher's test needs no Menagerie; tests.yml runs the rest.
      - name: Test the ROS camera publisher
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source ws/install/setup.bash
          ctest --test-dir ws/build/mj_kdl_wrapper -R '^CameraRosTest\.' \
            --no-tests=error --output-on-failure
