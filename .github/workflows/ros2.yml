name: ros2

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  colcon:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ROS 2 LTS distros to support: Jazzy Jalisco and Lyrical Luth.
        ros_distro: [jazzy, lyrical]
    container:
      image: ros:${{ matrix.ros_distro }}
    steps:
      # System build dependencies (KDL and MuJoCo are built from source, not installed from apt).
      # The camera publisher needs only the core, so render and viewer are left out here.
      # image_transport is not in the ros-base image; rclcpp, sensor_msgs and rosgraph_msgs are.
      - name: Install dependencies
        run: |
          apt-get update -q
          apt-get install -y \
            git cmake g++ python3-vcstool libeigen3-dev ffmpeg \
            python3-colcon-common-extensions \
            ros-${{ matrix.ros_distro }}-image-transport

      # The wrapper goes under the colcon workspace src/.
      - name: Checkout the wrapper into the workspace
        uses: actions/checkout@v4
        with:
          path: ws/src/mj_kdl_wrapper

      # The secorolab Orocos KDL fork is a workspace package, at ws/src/third_party/, and MuJoCo's
      # source lands beside it.
      - name: Import the Orocos KDL fork and MuJoCo
        run: vcs import ws/src < ws/src/mj_kdl_wrapper/mj_kdl_wrapper.repos

      # Build the shared KDL first, then the wrapper against it (FROM_PACKAGE).
      - name: colcon build (KDL first, then the wrapper against it)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ws
          colcon build --packages-select orocos_kdl --cmake-args -DENABLE_TESTS=OFF
          source install/setup.bash
          colcon build --packages-select mj_kdl_wrapper \
            --cmake-args -DMJ_KDL_OROCOS_KDL_FROM_PACKAGE=ON \
                         -DMJ_KDL_MUJOCO_DIR="${PWD}/src/third_party/mujoco" \
                         -DMJ_KDL_WITH_RENDER=OFF -DMJ_KDL_WITH_VIEWER=OFF \
                         -DMJ_KDL_WITH_ROS=ON \
                         -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF

      # Only the ROS camera publisher's test; tests.yml runs the rest.
      - name: Test the ROS camera publisher
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source ws/install/setup.bash
          ctest --test-dir ws/build/mj_kdl_wrapper -R '^CameraRosTest\.' \
            --no-tests=error --output-on-failure
