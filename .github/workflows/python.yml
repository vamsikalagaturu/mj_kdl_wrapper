name: python

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bindings:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MUJOCO_VERSION: 3.14.0
      MJ_KDL_MUJOCO_DIR: /tmp/mujoco-3.14.0
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache \
            libeigen3-dev libglfw3-dev libgl-dev libegl-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-python-${{ matrix.python-version }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-python-${{ matrix.python-version }}-${{ runner.os }}-

      # The build clones the pinned KDL fork here (ExternalProject, not FetchContent).
      - name: Cache the Orocos KDL checkout
        uses: actions/cache@v4
        with:
          path: third_party/orocos_kinematics_dynamics
          key: orocos-kdl-${{ hashFiles('cmake/Versions.cmake') }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache MuJoCo
        id: cache-mujoco
        uses: actions/cache@v4
        with:
          path: ${{ env.MJ_KDL_MUJOCO_DIR }}
          key: mujoco-${{ runner.os }}-${{ env.MUJOCO_VERSION }}

      - name: Install MuJoCo ${{ env.MUJOCO_VERSION }}
        if: steps.cache-mujoco.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/google-deepmind/mujoco/releases/download/${MUJOCO_VERSION}/mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"
          tar xzf "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz" -C /tmp
          rm "mujoco-${MUJOCO_VERSION}-linux-x86_64.tar.gz"

      # Keyed on the pins, no fallback: a kept checkout is never moved to a new pin.
      # mj-kdl-fetch-menagerie (run below) fetches it on a miss and copies the bundled assets.
      - name: Cache MuJoCo Menagerie
        uses: actions/cache@v4
        with:
          path: ~/.cache/mj_kdl_wrapper/menagerie
          key: menagerie-${{ runner.os }}-${{ hashFiles('cmake/Versions.cmake') }}

      - name: Build and test the Python bindings
        run: |
          pip install uv
          uv venv .venv
          . .venv/bin/activate
          uv pip install . \
            --config-settings=cmake.define.MJ_KDL_MUJOCO_DIR="${MJ_KDL_MUJOCO_DIR}" \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache
          uv pip install pytest
          mj-kdl-fetch-menagerie
          test -f ~/.cache/mj_kdl_wrapper/menagerie/kinova_gen3/gen3.xml
          python -c "import PyKDL, mujoco, mj_kdl_wrapper as mjk; print(mujoco.mj_versionString(), mjk.__mujoco_version__)"
          set -o pipefail
          pytest -q -rs python/tests | tee pytest.log
          # A skipped test fails the job, except where the runner has no offscreen rendering.
          ! grep '^SKIPPED' pytest.log | grep -v 'no offscreen rendering'
