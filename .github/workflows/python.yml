name: python

on:
  # Only main: dev is both a push target and the release PR's head, so it ran twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bindings:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # MuJoCo 4.0 supports Python 3.11 and newer.
        python-version: ["3.11", "3.12"]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4

      # The wheel links the pip mujoco-core library and builds the same viewer and recorder as
      # C++, so it needs the same headers (EGL, X11, Wayland) and ffmpeg for the recorder test.
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            ccache ninja-build ffmpeg vcstool \
            libeigen3-dev libegl-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-python-${{ matrix.python-version }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-python-${{ matrix.python-version }}-${{ runner.os }}-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Import the Orocos KDL fork and MuJoCo
        run: vcs import < mj_kdl_wrapper.repos

      - name: Build and test the Python bindings
        run: |
          pip install uv
          uv venv .venv
          . .venv/bin/activate
          uv pip install . \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            --config-settings=cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache
          uv pip install pytest
          python -c "import PyKDL, mujoco, mj_kdl_wrapper as mjk; print(mujoco.mj_versionString(), mjk.__mujoco_version__)"
          set -o pipefail
          pytest -q -rs python/tests | tee pytest.log
          # A skipped test fails the job.
          ! grep '^SKIPPED' pytest.log
