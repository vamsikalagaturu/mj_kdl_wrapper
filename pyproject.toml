[build-system]
requires = [
  "scikit-build-core>=1.1",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "mjkdl"
dynamic = ["version"]
description = "Python bindings for mjkdl: MuJoCo physics with Orocos KDL kinematics and dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Vamsi Kalagaturu" },
]
keywords = ["mujoco", "kdl", "orocos", "kinematics", "dynamics", "robotics", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "mujoco==3.14.0",
]

[project.urls]
Homepage = "https://github.com/vamsikalagaturu/mjkdl"
Repository = "https://github.com/vamsikalagaturu/mjkdl"
Documentation = "https://github.com/vamsikalagaturu/mjkdl#readme"
Issues = "https://github.com/vamsikalagaturu/mjkdl/issues"

[tool.scikit-build]
cmake.args = [
  "-DBUILD_PYTHON_BINDINGS=ON",
  "-DBUILD_TESTS=OFF",
  "-DBUILD_EXAMPLES=OFF",
]
build-dir = "build/{wheel_tag}"
sdist.include = [
  "cmake/Versions.cmake",
]

[tool.scikit-build.wheel.packages]
mjkdl = "python/mjkdl"

# cmake/Versions.cmake is the one place the version is written.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "cmake/Versions.cmake"
regex = '^set\(MJKDL_VERSION "(?P<value>[^"]+)"\)'

[tool.ruff]
line-length = 100
